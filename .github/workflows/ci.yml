name: CI

on:
  push:
    branches: [develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SKIP: ${{ github.event_name == 'pull_request' && github.head_ref == 'develop' && github.base_ref == 'master' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - if: env.SKIP != 'true'
        uses: actions/checkout@v4
      - if: env.SKIP != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: env.SKIP != 'true'
        run: python -m pip install --upgrade pip
      - if: env.SKIP != 'true'
        run: python -m pip install -e . --group lint
      - if: env.SKIP != 'true'
        run: ruff check .
      - if: env.SKIP != 'true'
        run: ruff format --check .
      - if: env.SKIP != 'true'
        run: mypy

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.14"
    runs-on: ${{ matrix.os }}
    env:
      HYPOTHESIS_PROFILE: ci
      COVERAGE: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' }}
    steps:
      - if: env.SKIP != 'true'
        uses: actions/checkout@v4
      - if: env.SKIP != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - if: env.SKIP != 'true'
        run: python -m pip install --upgrade pip
      - if: env.SKIP != 'true' && runner.os == 'macOS'
        run: brew install libomp
      - if: env.SKIP != 'true'
        run: python -m pip install -e . --group test
      - if: env.SKIP != 'true' && env.COVERAGE != 'true'
        run: pytest
      - if: env.SKIP != 'true' && env.COVERAGE == 'true'
        run: |
          python -m pip install -e ".[ortools,pyvrp]"
          coverage run -m pytest
          coverage report

  docs:
    runs-on: ubuntu-latest
    steps:
      - if: env.SKIP != 'true'
        uses: actions/checkout@v4
      - if: env.SKIP != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - if: env.SKIP != 'true'
        run: python -m pip install --upgrade pip
      - if: env.SKIP != 'true'
        run: python -m pip install --group docs
      - if: env.SKIP != 'true'
        run: mkdocs build --strict

  build:
    runs-on: ubuntu-latest
    steps:
      - if: env.SKIP != 'true'
        uses: actions/checkout@v4
      - if: env.SKIP != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: env.SKIP != 'true'
        run: python -m pip install --upgrade pip build twine
      - if: env.SKIP != 'true'
        run: python -m build
      - if: env.SKIP != 'true'
        run: twine check --strict dist/*
