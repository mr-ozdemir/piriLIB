name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . --group dev
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest

  build:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build packaging
      - name: Check that the tag matches the package version
        id: version
        run: |
          version=$(python -c "import runpy; print(runpy.run_path('src/pirilib/_version.py')['__version__'])")
          test "v$version" = "$GITHUB_REF_NAME"
          python -c "from packaging.version import Version; v = Version('$version'); assert str(v) == '$version', 'version is not in normalized PEP 440 form'; print(f'prerelease={str(v.is_prerelease).lower()}')" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
      - run: python -m build
      - name: Smoke test the wheel
        run: |
          python -m pip install dist/*.whl
          pirilib --help
          python -c "import pirilib; print(pirilib.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    name: testpypi (every version)
    needs: [test, build]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: pypi (final versions only)
    needs: [build, testpypi]
    if: needs.build.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
