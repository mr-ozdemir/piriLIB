name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: A minimal problem file or code snippet, and the full error message.
      render: python
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versions
      description: Output of `python -c "import pirilib, sys; print(pirilib.__version__, sys.version)"` and your operating system.
    validations:
      required: true
